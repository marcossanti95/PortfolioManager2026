{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h2 class="mb-4">
            Agregar activo
            {% if tipo == "variable" %}(Renta Variable){% else %}(Renta Fija){% endif %}
        </h2>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <div class="text-danger small">{{ error }}</div>
                    {% endfor %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary w-100">Agregar</button>
        </form>
        <a href="{% url 'detalle_cartera' cartera.id %}" class="btn btn-outline-secondary btn-sm mt-3">&larr; Volver a la cartera</a>
    </div>
</div>
{% endblock %}
